name: QEMU Windows 10 (Tailscale + noVNC + Intel HDA Audio)

on:
  workflow_dispatch:

jobs:
  run-qemu-tailscale-audio:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM, Audio & noVNC Tools
        run: |
          echo "=== [STEP 1/5] Installing QEMU, Audio Subsystem & Utilities ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            wget \
            aria2 \
            novnc \
            websockify \
            alsa-utils \
            pulseaudio

          echo "=== Setting KVM permissions ==="
          sudo chmod 666 /dev/kvm || true

      - name: 2. Install & Authenticate Tailscale
        run: |
          echo "=== [STEP 2/5] Installing Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh

          echo "=== [TAILSCALE VERIFICATION] Starting Login Process ==="
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 3

          echo "=================================================================="
          echo "    CLICK THE LINK BELOW TO VERIFY RUNNER IN TAILSCALE CONSOLE    "
          echo "=================================================================="
          sudo tailscale up --authkey="" || true
          echo "=================================================================="

          echo "Waiting for Tailscale verification..."
          until sudo tailscale status | grep -q "100."; do
            echo "Waiting for user to authorize device in Tailscale Admin Panel..."
            sleep 10
          done

          echo "Tailscale successfully connected!"
          sudo tailscale ip -4

      - name: 3. Download Windows 10 ISO & Red Hat VirtIO/Audio Drivers
        run: |
          echo "=== [STEP 3/5] Downloading ISO Images ==="
          
          VIRTIO_URL="https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.262-1/virtio-win.iso"
          WIN10_URL="https://archive.org/download/windows-10_20230409/Windows%2010.iso"

          echo "Downloading VirtIO & Sound Drivers ISO..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o virtio-win.iso "$VIRTIO_URL" || wget -O /tmp/virtio-win.iso "$VIRTIO_URL"

          echo "Downloading Windows 10 ISO..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win10.iso "$WIN10_URL" || wget -O /tmp/win10.iso "$WIN10_URL"

      - name: 4. Create Custom 1TB Virtual Disk
        run: |
          echo "=== [STEP 4/5] Creating 1TB Main Disk ==="
          qemu-img create -f qcow2 /tmp/win10_main.qcow2 1000G

      - name: 5. Launch QEMU with Intel HDA Audio Driver & noVNC
        run: |
          echo "=== [STEP 5/5] Launching QEMU with Intel HDA Audio ==="

          # Включаем виртуальную звуковую карту в эмуляторе
          export QEMU_AUDIO_DRV=alsa

          # Запуск QEMU c поддержкой Intel High Definition Audio (ICH9)
          qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,accel=kvm \
            -m 16384 \
            -object memory-backend-ram,id=mem,size=16384M \
            -numa node,memdev=mem \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu host,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time,hv_vpindex,hv_synic,hv_stimer,hv_reset,hv_frequencies,hv_tlbflush \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=/tmp/win10_main.qcow2,format=qcow2,index=0,media=disk,if=virtio,cache=none,aio=native \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -drive file=/tmp/virtio-win.iso,index=2,media=cdrom \
            -device ich9-intel-hda \
            -device hda-duplex,id=sound0,bus=ich9-intel-hda.0,cad=0 \
            -vga qxl \
            -vnc 127.0.0.1:0 \
            -net nic,model=virtio \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          # Запуск noVNC
          websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5900 &

          TAILSCALE_IP=$(sudo tailscale ip -4)

          echo "=================================================="
          echo " QEMU WINDOWS 10 RUNNING"
          echo "=================================================="
          echo " Audio Driver  : Intel High Definition Audio (ICH9 HDA)"
          echo " CPU / RAM     : 4 Cores / 16 GB"
          echo " Disk Size     : 1 TB"
          echo " Tailscale IP  : $TAILSCALE_IP"
          echo " noVNC URL     : http://$TAILSCALE_IP:6080/vnc.html"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "Windows 10 Active | $(date)"
          done
