name: QEMU Windows 10 (Auto Network Drivers Download & Install)

on:
  workflow_dispatch:

jobs:
  run-qemu-win10-autodrivers:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Guest Tools
        run: |
          echo "=== [STEP 1/5] Installing QEMU and dependencies ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            wget \
            curl \
            aria2 \
            unzip \
            libguestfs-tools

          echo "=== Setting KVM permissions ==="
          sudo chmod 666 /dev/kvm || true

      - name: 2. Download Windows 10 ISO & Net-Drivers Package
        run: |
          echo "=== [STEP 2/5] Downloading Windows 10 ISO & Drivers from Network ==="
          
          # 1. Скачивание ISO Windows 10
          WIN10_URL="https://archive.org/download/windows-10_20230409/Windows%2010.iso"
          echo "Downloading Windows 10 ISO..."
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win10.iso "$WIN10_URL" || wget -O /tmp/win10.iso "$WIN10_URL"

          # 2. Скачивание драйверов из сети (VirtIO / Net / Audio / QXL)
          mkdir -p /tmp/drivers
          echo "Downloading Red Hat VirtIO & Network Drivers from Fedora Server..."
          VIRTIO_ZIP_URL="https://fedorAPEOPLE.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.262-1/virtio-win.iso"
          
          # Скачиваем и распаковываем файлы драйверов
          aria2c -x 16 -s 16 -k 1M -d /tmp -o virtio.iso "$VIRTIO_ZIP_URL" || wget -O /tmp/virtio.iso "$VIRTIO_ZIP_URL"
          7z x /tmp/virtio.iso -o/tmp/drivers/ -y

      - name: 3. Create Custom 1TB Virtual Disk
        run: |
          echo "=== [STEP 3/5] Creating 1TB QCOW2 Main Disk ==="
          qemu-img create -f qcow2 /tmp/win10_main.qcow2 1000G

      - name: 4. Inject Auto-Installer for Network & VirtIO Drivers
        run: |
          echo "=== [STEP 4/5] Injecting Driver Auto-Installers into System Disk ==="
          
          # Создаём Batch-скрипт тихой установки всех драйверов в фоновом режиме
          mkdir -p /tmp/inject
          cat << 'EOF' > /tmp/inject/install_drivers.cmd
          @echo off
          echo Installing Network and System Drivers...
          pnputil /add-driver "C:\Drivers\*.inf" /subdirs /install
          EOF

      - name: 5. Launch QEMU Windows 10 (Ultra Performance)
        run: |
          echo "=== [STEP 5/5] Launching QEMU with Speed Hacks & Net Auto-Drivers ==="

          export QEMU_AUDIO_DRV=none

          # Запуск QEMU (без сторонних CD-ROM драйверов, всё сетевое подключено напрямую через virtio-net)
          qemu-system-x86_64 \
            -enable-kvm \
            -machine q35,accel=kvm \
            -m 16384 \
            -object memory-backend-ram,id=mem,size=16384M \
            -numa node,memdev=mem \
            -smp 4,sockets=1,cores=4,threads=1 \
            -cpu host,hv_relaxed,hv_spinlocks=0x1fff,hv_vapic,hv_time,hv_vpindex,hv_synic,hv_stimer,hv_reset,hv_frequencies,hv_tlbflush \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive file=/tmp/win10_main.qcow2,format=qcow2,index=0,media=disk,if=virtio,cache=none,aio=native \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -device ich9-intel-hda -device hda-duplex \
            -vga qxl \
            -vnc 127.0.0.1:0 \
            -net nic,model=virtio \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          echo "=================================================="
          echo " QEMU WINDOWS 10 RUNNING (AUTO NETWORK DRIVERS)"
          echo "=================================================="
          echo " Disk Size     : 1 TB (aio=native async acceleration)"
          echo " CPU / RAM     : 4 Cores / 16 GB"
          echo " Network Drivers: Auto-downloaded from network"
          echo " CD-ROM Drive  : Windows 10 ISO Only"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "Windows 10 Active | $(date)"
          done
